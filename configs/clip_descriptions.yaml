  - a photo of a cargo ship or an ocean liner at sea
  - a photo of a ship docked in a harbor
  - a photo of a sailing ship with masts
  - a photo of a boat or a ferry on a river
truck:
  - a photo of a truck, a large motor vehicle for carrying goods
  - a photo of a pickup truck
  - a photo of a semi-trailer truck on a highway
  - a photo of a fire truck or a dump truck
