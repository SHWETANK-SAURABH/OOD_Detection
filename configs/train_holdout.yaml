# Stage 9 ablation: Kaggle-only hold-out, 40,000 train / 5,000 val / 5,000 test (all Kaggle images).
# Same recipe as configs/train.yaml; only the splits and run name differ.
name: resnet18_holdout
seed: 0
data_config: configs/data.yaml
train_split: train40k
val_split: val
test_split: test_kaggle5k
epochs: 100
batch_size: 128
lr: 0.1
momentum: 0.9
weight_decay: 0.0005
nesterov: true
lr_min: 1.0e-6
num_workers: 4
amp: true
out_dir: results/checkpoints
